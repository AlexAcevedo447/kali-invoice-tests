# Ambiente local desde el contenedor de JMeter (predeterminado de la imagen): el stack corre en el host.
kali.environment.name=local-docker
kali.environment.kind=local
auth.protocol=http
auth.host=host.docker.internal
auth.port=18080
invoice.protocol=http
invoice.host=host.docker.internal
invoice.port=8080

# Datos EXCLUSIVOS de performance (empresa propia; no se usan datos de otras pruebas ni reales).
perf.tenant.code=perf
perf.tenant.name=Kali Performance
perf.user.email=perf.load@kali.local
perf.customer.document=PERF-CLIENTE-001
perf.customer.name=Cliente Performance
perf.product.code=PERF-PROD-001
perf.product.name=Producto Performance
# Administrador de plataforma (solo para "provision"); la contraseña llega por KALI_PLATFORM_ADMIN_PASSWORD.
platform.admin.email=master@local.dev
