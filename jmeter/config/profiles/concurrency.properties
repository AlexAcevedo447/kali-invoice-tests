# Prueba LOCAL de concurrencia (exploratoria; plans/invoice-kali-concurrency.jmx).
# Escalones independientes y secuenciales. En cada uno:
#   [0, rampup)                      subida gradual de usuarios      -> calentamiento
#   [rampup, rampup+warmup)          estabilización                   -> calentamiento
#   [rampup+warmup, +hold)           carga sostenida                  -> MEDICIÓN
# Solo la ventana de medición entra en p95, errores y throughput reportados.
# No define umbrales de aceptación ni representa la capacidad de producción.
concurrency.steps=1,5,10
concurrency.rampup=30
concurrency.warmup=30
concurrency.hold=120
# Pausa aleatoria (ms) antes de consultar y antes de crear una factura.
think.min.ms=1000
think.max.ms=3000
